# AX55 builder — configuration, branch `dtest3-rtl8367d`.
#
# TEST BRANCH. Identical to `main` (branch mode on ax55-618-rebase) plus one
# local patch: namiltd's RTL8367S-VB / family-D series v4 from
# namiltd/openwrt#134, added as target/linux/generic/pending-6.18/944-*.
# Purpose: build it in a clean environment and hand a RAM-only initramfs to
# the two forum users who actually own family-D hardware (the series cannot
# be finished without it). Releases are tagged `ax55-618-dtest3-*` so they
# never collide with the nightly `ax55-618-*` ones.
# Run it manually: Actions -> Build -> Run workflow -> branch
# `dtest3-rtl8367d`. Push/schedule triggers stay on `main`.
#
# Purpose of the builder itself: clean-room CI verification of the AX55 v1
# port. Two modes, both proven on this device:
#   - patch mode (sources.patch: full, the default): plain upstream branch
#     + the published full patch + BDFs — exactly as a downstream builder
#     (eko.one.pl) consumes the patch set;
#   - branch mode (sources.patch: none): the upstream repo/branch below
#     already contains the AX55 support (a PR branch on our fork); only the
#     BDFs are fetched from the sources repo.
# Either way the workflow FAILS if the resulting image lacks the DWMAC
# ethernet driver or the AX55 BDF package, so a silently-dropped hunk can
# never produce a "successful" broken image again.

# Upstream OpenWrt source (the tree that will be checked out and built).
# Currently: our openwrt fork, PR-shaped branch with the AX55 port on
# openwrt main + kernel 6.18 fixes (CMN PLL bus clocks, SNAND SET_FEATURE,
# rtl8365mb reset wait).
upstream:
  repo: kuncy7/openwrt-nss-edma
  branch: ax55-618-rebase

# AX55 sources repo. In branch mode only the two BDFs are fetched from here
# (they are not part of the upstream ipq-wifi feed yet — see PR #143 on the
# ax55-bdf fork). A push here still triggers a rebuild.
sources:
  repo: kuncy7/openwrt-ax55-v1
  branch: master
  dir: src-2512
  patch: none

# Device id. Must match a directory under devices/<id>/ containing
#   - config        (the OpenWrt .config seed)
#   - files/        (overlay rootfs, optional)
device: tplink_archer-ax55-v1

# Custom feeds appended to feeds.conf during build. None needed for this
# device; the mechanism is kept for parity with the AW1000 builder.
feeds: []

# Release publishing settings.
release:
  prefix: ax55-618-dtest3        # tag = <prefix>-<UTC timestamp>-<run id>
  keep: 3                        # number of newest releases to retain
  artifact_retention_days: 7
