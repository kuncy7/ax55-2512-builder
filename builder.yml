# AX55 builder — configuration, branch `2512`.
#
# This branch is the PATCH-MODE configuration: plain openwrt-25.12 + the
# published full patch + BDFs, exactly as the downstream nightly builder
# (eko.one.pl) consumes the patch set. It exists to clean-room-verify
# src-2512/ax55-v1-openwrt-2512-full.patch after every revision of it.
#
# Run it manually: Actions -> Build -> Run workflow -> branch `2512`.
# (push/schedule triggers stay on `main`, which tracks the 6.18 branch.)

# Upstream OpenWrt source (the tree that will be checked out and built).
upstream:
  repo: openwrt/openwrt
  branch: openwrt-25.12

# AX55 patch-set source: the full patch and both board files are fetched
# from here at build time and applied with git apply (atomic).
sources:
  repo: kuncy7/openwrt-ax55-v1
  branch: master
  dir: src-2512
  patch: full

# Device id. Must match a directory under devices/<id>/ containing
#   - config        (the OpenWrt .config seed)
#   - files/        (overlay rootfs, optional)
device: tplink_archer-ax55-v1

# Custom feeds appended to feeds.conf during build. None needed for this
# device; the mechanism is kept for parity with the AW1000 builder.
feeds: []

# Release publishing settings.
release:
  prefix: ax55-2512              # tag = <prefix>-<UTC timestamp>-<run id>
  keep: 3                        # number of newest releases to retain
  artifact_retention_days: 7
