name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'builder.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'builder.yml'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7
          ./actionlint -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          mapfile -t files < <(find scripts -name '*.sh' | sort)
          printf 'checking %s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run yamllint
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}}}" \
            builder.yml .github/workflows/

  tests:
    name: script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - name: Run tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts/tests -name '*.test.sh' | sort)
          [[ ${#tests[@]} -gt 0 ]] || { echo "::error::no tests found under scripts/tests"; exit 1; }
          for t in "${tests[@]}"; do
            echo "== $t"
            bash "$t"
          done
