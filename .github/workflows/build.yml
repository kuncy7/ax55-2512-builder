name: Build

# All build/release/cleanup behavior reads its configuration from builder.yml.
# The cron schedule below is the only knob that cannot be expressed there
# (GitHub Actions cron values must be static strings in this file).
# This repository is private, so runner minutes come out of a quota: one full
# run costs ~135 of them (a ~70 min firmware build plus a ~70 min guard that
# compiles the kernel a second time). The triggers below are deliberately
# narrow - see also the `if:` on the guard job.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Only things that change what lands in the image. Edits to scripts/
      # are covered by the Lint workflow (shellcheck + unit tests) and by the
      # next scheduled run; a full build for a script tweak is ~135 runner
      # minutes for nothing.
      - builder.yml
      - 'devices/**'
      - 'common/**'
      - 'patches/**'
      - '.github/workflows/build.yml'
  schedule:
    # Nightly. Cheap by design: `check-updates` compares the upstream and
    # sources SHAs against the newest release and skips in seconds when
    # nothing moved. Since `upstream` points at our own fork branch, this is
    # also the ONLY automatic trigger that notices a push to that branch -
    # pushing there does not touch this repository.
    - cron: "30 3 * * *"

concurrency:
  group: build-${{ github.ref }}
  # A superseded run can only produce a stale image; stop it burning minutes.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    name: Load builder.yml
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      upstream_repo: ${{ steps.cfg.outputs.upstream_repo }}
      upstream_branch: ${{ steps.cfg.outputs.upstream_branch }}
      sources_repo: ${{ steps.cfg.outputs.sources_repo }}
      sources_branch: ${{ steps.cfg.outputs.sources_branch }}
      sources_dir: ${{ steps.cfg.outputs.sources_dir }}
      sources_patch: ${{ steps.cfg.outputs.sources_patch }}
      device: ${{ steps.cfg.outputs.device }}
      device_dir: ${{ steps.cfg.outputs.device_dir }}
      release_prefix: ${{ steps.cfg.outputs.release_prefix }}
      release_keep: ${{ steps.cfg.outputs.release_keep }}
      artifact_retention_days: ${{ steps.cfg.outputs.artifact_retention_days }}
      feeds_lines: ${{ steps.cfg.outputs.feeds_lines }}
    steps:
      - uses: actions/checkout@v6
      - id: cfg
        run: bash scripts/load-config.sh

  check-updates:
    name: Check upstream
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: ${{ needs.config.outputs.upstream_repo }}
      UPSTREAM_BRANCH: ${{ needs.config.outputs.upstream_branch }}
      SOURCES_REPO: ${{ needs.config.outputs.sources_repo }}
      SOURCES_BRANCH: ${{ needs.config.outputs.sources_branch }}
      RELEASE_PREFIX: ${{ needs.config.outputs.release_prefix }}
    outputs:
      build_required: ${{ steps.check.outputs.build_required }}
      main_sha: ${{ steps.check.outputs.main_sha }}
      sources_sha: ${{ steps.check.outputs.sources_sha }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" --jq .sha)
          sources_sha=$(gh api "repos/${SOURCES_REPO}/commits/${SOURCES_BRANCH}" --jq .sha)

          # Dedup against the newest release for our own prefix. Only a
          # scheduled tick should dedup; push and workflow_dispatch always build.
          latest_release_body=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name | startswith(\"${RELEASE_PREFIX}\"))][0].body // \"\"" 2>/dev/null || echo "")

          build_required=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] \
             && [[ "$latest_release_body" == *"$main_sha"* ]] \
             && [[ "$latest_release_body" == *"$sources_sha"* ]]; then
            build_required=false
          fi

          {
            echo "## Upstream check"
            echo "- upstream: \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` -> \`${main_sha}\`"
            echo "- sources:  \`${SOURCES_REPO}@${SOURCES_BRANCH}\` -> \`${sources_sha}\`"
            echo "- build_required: **${build_required}**"
          } >>"$GITHUB_STEP_SUMMARY"

          {
            echo "build_required=$build_required"
            echo "main_sha=$main_sha"
            echo "sources_sha=$sources_sha"
          } >>"$GITHUB_OUTPUT"

  # Guard against a class of failure the main build cannot see: our config
  # symbols are correct for OUR configuration, but a downstream builder that
  # selects every kernel module (eko.one.pl does) drags CONFIG_PTP_1588_CLOCK
  # to =m, and kconfig then quietly demotes STMMAC_ETH and DWMAC_IPQ5018 with
  # it. The image still builds and boots, with no eth0. This job reproduces
  # that configuration and only builds far enough to inspect the kernel
  # config; it deliberately does not produce or publish an image.
  #
  # It compiles the kernel a second time, so it doubles the cost of a run.
  # What it guards against only changes when the SOURCE changes (kernel
  # config, patches, device config) - not when a builder script is edited.
  # So it is skipped for pushes to this repository and runs on the scheduled
  # source-change builds, plus on demand via "Run workflow". After editing
  # devices/*/config, dispatch a run manually rather than waiting a day.
  guard-all-kmods:
    name: Guard - kernel config under ALL_KMODS
    needs: [config, check-updates]
    if: >-
      needs.check-updates.outputs.build_required == 'true' &&
      github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAIN_SHA: ${{ needs.check-updates.outputs.main_sha }}
      SOURCES_SHA: ${{ needs.check-updates.outputs.sources_sha }}
      SOURCES_REPO: ${{ needs.config.outputs.sources_repo }}
      SOURCES_DIR: ${{ needs.config.outputs.sources_dir }}
      DEVICE_DIR: ${{ needs.config.outputs.device_dir }}
      FEEDS_LINES: ${{ needs.config.outputs.feeds_lines }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Checkout OpenWrt source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.config.outputs.upstream_repo }}
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v6
        with:
          path: builder

      - name: Prepare build environment (with ALL_KMODS)
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
          SOURCES_PATCH: ${{ needs.config.outputs.sources_patch }}
          CONFIG_FRAGMENT: config.all-kmods
        run: bash builder/scripts/prepare-build.sh

      - name: Confirm the fragment took effect
        working-directory: openwrt
        run: |
          set -euo pipefail
          grep -q '^CONFIG_ALL_KMODS=y' .config \
            || { echo "::error::CONFIG_ALL_KMODS=y did not survive defconfig - guard would be meaningless"; exit 1; }
          echo "CONFIG_ALL_KMODS=y present"

      # target/linux/compile does not pull in its own prerequisites when it is
      # invoked directly from the top level: without a toolchain in staging_dir
      # it dies in seconds with a bare "target/linux failed to build". Build
      # tools and toolchain explicitly first.
      - name: Build tools and toolchain
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" tools/install
          make -j"$(nproc)" toolchain/install

      - name: Build the kernel only
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)" target/linux/compile; then
            echo "::warning::kernel build failed; re-running single-threaded for diagnostics"
            make -j1 V=s target/linux/compile
          fi

      - name: Verify kernel config symbols
        run: bash builder/scripts/check-kernel-config.sh openwrt | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build firmware
    needs: [config, check-updates]
    if: needs.check-updates.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: ${{ needs.check-updates.outputs.main_sha }}
      SOURCES_SHA: ${{ needs.check-updates.outputs.sources_sha }}
      SOURCES_REPO: ${{ needs.config.outputs.sources_repo }}
      SOURCES_DIR: ${{ needs.config.outputs.sources_dir }}
      DEVICE: ${{ needs.config.outputs.device }}
      DEVICE_DIR: ${{ needs.config.outputs.device_dir }}
      RELEASE_PREFIX: ${{ needs.config.outputs.release_prefix }}
      ARTIFACT_RETENTION_DAYS: ${{ needs.config.outputs.artifact_retention_days }}
      FEEDS_LINES: ${{ needs.config.outputs.feeds_lines }}
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Checkout OpenWrt source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.config.outputs.upstream_repo }}
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          path: openwrt

      - name: Checkout builder repo
        uses: actions/checkout@v6
        with:
          path: builder

      - name: Prepare build environment
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
          BUILDER_REPO: ${{ github.workspace }}/builder
          SOURCES_PATCH: ${{ needs.config.outputs.sources_patch }}
        run: bash builder/scripts/prepare-build.sh

      # Costs seconds and covers what this builder structurally cannot: our
      # patches add Kconfig symbols to the whole qualcommax target, but we only
      # ever build ipq50xx, so an unanswered symbol breaks sibling subtargets
      # for downstream builders and never for us. Runs before the long build so
      # it fails in the first minute rather than the seventieth.
      - name: Verify owned Kconfig symbols cover sibling subtargets
        run: |
          bash builder/scripts/check-target-symbols.sh \
            openwrt "builder/${{ needs.config.outputs.device_dir }}/owned-symbols" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set reproducible-build env
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
            echo "TZ=UTC"
            echo "LC_ALL=C"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github"
          } >>"$GITHUB_ENV"

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "Download attempt $attempt failed; retrying..."
            sleep 5
          done

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed; retrying single-threaded for diagnostics"
            make -j1 V=s
          fi

      - name: Verify kernel config symbols
        run: bash builder/scripts/check-kernel-config.sh openwrt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify image (DWMAC driver present)
        run: |
          set -euo pipefail
          img=$(find openwrt/bin/targets/qualcommax/ipq50xx -name "*sysupgrade.bin" | head -1)
          [ -n "$img" ] || { echo "::error::no sysupgrade image produced"; exit 1; }
          bash builder/scripts/check-image.sh "$img" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.config.outputs.device }}-images
          path: openwrt/bin/targets/qualcommax/ipq50xx
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish release
        id: release
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          tag_name="${RELEASE_PREFIX}-${timestamp}-${GITHUB_RUN_ID}"
          echo "release_tag=$tag_name" >>"$GITHUB_OUTPUT"

          {
            echo "## OpenWrt AX55 v1 build"
            echo "- **Date**: $date"
            echo "- **Device**: \`${DEVICE}\`"
            echo "- **Upstream**: \`${MAIN_SHA}\`"
            echo "- **Sources**: \`${SOURCES_REPO}@${SOURCES_SHA}\` (\`${SOURCES_DIR}\`)"
            echo "- **Trigger**: \`${GITHUB_EVENT_NAME}\`"
            echo "- Image verified: DWMAC driver present in the kernel."
          } >release_notes.md

          mapfile -t assets < <(find openwrt/bin/targets/qualcommax/ipq50xx/ -type f -not -path "*/packages/*")
          gh release create "$tag_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AX55 v1 build $date" \
            --notes-file release_notes.md \
            "${assets[@]}"

          {
            echo "## Release"
            echo "- tag: \`${tag_name}\`"
            echo "- assets: ${#assets[@]}"
          } >>"$GITHUB_STEP_SUMMARY"

  prune:
    name: Prune old releases
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP: ${{ needs.config.outputs.release_keep }}
      CURRENT_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/prune-releases.sh
